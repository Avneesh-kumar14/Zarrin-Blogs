name: Code Review & Quality

on:
  pull_request:
    branches: [main, develop]

jobs:
  code-review:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install ESLint
        run: |
          npm install -g eslint
          npm install -g eslint-config-airbnb eslint-plugin-import eslint-plugin-jsx-a11y eslint-plugin-react

      - name: Check Backend Code
        run: |
          cd Zarrin_server
          eslint . --ext .js,.jsx --format json --output-file eslint-report.json 2>/dev/null || true
          echo "Backend code review completed"

      - name: Check Frontend Code
        run: |
          cd zarrin_blogs
          eslint src --ext .js,.jsx --format json --output-file eslint-report.json 2>/dev/null || true
          echo "Frontend code review completed"

      - name: Comment PR
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Code review completed! Please check the CI/CD logs for details.'
            })
