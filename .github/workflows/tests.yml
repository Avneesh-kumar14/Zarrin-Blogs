name: Testing & CI/CD Pipeline

# WHEN THIS WORKFLOW RUNS
# Triggered on: push to main branch and pull requests
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# WHAT JOBS TO RUN
jobs:
  # ========================================
  # JOB 1: LINT & FORMAT CHECK
  # ========================================
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          cd Zarrin_server && npm ci
          cd ../zarrin_blogs && npm ci
      
      - name: Run linting (if available)
        continue-on-error: true
        run: |
          cd Zarrin_server && npm run lint || true
          cd ../zarrin_blogs && npm run lint || true

  # ========================================
  # JOB 2: BACKEND TESTS
  # ========================================
  backend-tests:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [16.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install backend dependencies
        working-directory: ./Zarrin_server
        run: npm ci
      
      - name: Run backend tests
        working-directory: ./Zarrin_server
        run: npm test -- --coverage
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key
          MONGODB_URI: mongodb://localhost:27017/zarrin_test
      
      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./Zarrin_server/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false

  # ========================================
  # JOB 3: FRONTEND TESTS
  # ========================================
  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [16.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install frontend dependencies
        working-directory: ./zarrin_blogs
        run: npm ci
      
      - name: Run frontend tests
        working-directory: ./zarrin_blogs
        run: npm test -- --watchAll=false --coverage
      
      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./zarrin_blogs/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  # ========================================
  # JOB 4: BUILD & DEPLOY (Optional)
  # ========================================
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16.x'
          cache: 'npm'
      
      - name: Build frontend
        working-directory: ./zarrin_blogs
        run: |
          npm ci
          npm run build
      
      - name: Backend build check
        working-directory: ./Zarrin_server
        run: |
          npm ci
          npm run build

  # ========================================
  # JOB 5: SECURITY CHECK (Optional)
  # ========================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16.x'
          cache: 'npm'
      
      - name: Run npm audit (Backend)
        working-directory: ./Zarrin_server
        continue-on-error: true
        run: npm audit --audit-level=moderate
      
      - name: Run npm audit (Frontend)
        working-directory: ./zarrin_blogs
        continue-on-error: true
        run: npm audit --audit-level=moderate

  # ========================================
  # FINAL STATUS CHECK
  # ========================================
  status:
    name: CI/CD Pipeline Status
    runs-on: ubuntu-latest
    needs: [lint, backend-tests, frontend-tests, build, security]
    if: always()
    
    steps:
      - name: Check pipeline status
        run: |
          if [ "${{ needs.lint.result }}" = "failure" ] || \
             [ "${{ needs.backend-tests.result }}" = "failure" ] || \
             [ "${{ needs.frontend-tests.result }}" = "failure" ] || \
             [ "${{ needs.build.result }}" = "failure" ]; then
            echo "Pipeline failed!"
            exit 1
          fi
          echo "All tests passed! ✅"

  # ========================================
  # DEPLOYMENT (Optional - Uncomment to enable)
  # ========================================
  # deploy-render:
  #   name: Deploy to Render
  #   runs-on: ubuntu-latest
  #   needs: status
  #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  #   
  #   steps:
  #     - name: Deploy Backend
  #       run: |
  #         curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
  #     
  #     - name: Deploy Frontend
  #       run: |
  #         curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}

# ========================================
# EXPLANATION FOR BEGINNERS
# ========================================
# 
# What is CI/CD?
# - CI (Continuous Integration): Automatically test code when pushed
# - CD (Continuous Deployment): Automatically deploy if tests pass
# 
# When does this run?
# - Every time you push to main or develop branch
# - Every time you create a pull request
# 
# What does it do?
# 1. LINT: Checks code quality
# 2. BACKEND TESTS: Runs all backend tests
# 3. FRONTEND TESTS: Runs all frontend tests
# 4. BUILD: Tries to build the application
# 5. SECURITY: Checks for vulnerabilities
# 6. STATUS: Reports overall result
# 
# Why is this useful?
# - Catches bugs before they reach production
# - Ensures code quality standards
# - Automates testing (saves time)
# - Prevents broken code from being deployed
# - Makes code reviews easier
# 
# How to use:
# 1. Push code to GitHub
# 2. Pipeline runs automatically
# 3. See results in Actions tab
# 4. If tests fail, fix code and push again
