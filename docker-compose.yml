version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:5-alpine
    container_name: zarrin-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./Zarrin_server
      dockerfile: Dockerfile
    container_name: zarrin-backend
    ports:
      - "8200:8200"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/zarrin?authSource=admin
      JWT_SECRET: your_jwt_secret_key_here
      EMAIL_USER: your_email@gmail.com
      EMAIL_PASSWORD: your_app_password
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: development
    volumes:
      - ./Zarrin_server:/app
      - /app/node_modules
    healthcheck:
      test: curl -f http://localhost:8200/api/auth/validate || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: ./zarrin_blogs
      dockerfile: Dockerfile
    container_name: zarrin-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:8200
    healthcheck:
      test: curl -f http://localhost:80 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongodb_data:

networks:
  default:
    name: zarrin-network
